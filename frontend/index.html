<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDM 專案進度狀態分析統計儀表板 (Aras Innovator 12 SP9)</title>
  <link rel="stylesheet" href="./css/dashboard.css" />
</head>
<body>
  <div class="pmo-app-shell">
    <!-- 頂部導航與檢視切換列 -->
    <header class="pmo-header">
      <div class="pmo-brand">
        <span class="pmo-brand-badge">Aras 12 SP9 | BWCS-CRM</span>
        <div class="pmo-title-group">
          <h1>PMO 專案進度狀態分析統計系統</h1>
          <p>整合 Project 客製欄位 (cn_* / bcs_* / Ph 1~12)、WBS 階段時程偏差與專案成員任務負荷分析</p>
        </div>
      </div>

      <nav class="pmo-nav-tabs" aria-label="儀表板視圖切換">
        <button type="button" class="pmo-tab-btn active" data-tab="SUMMARY" id="tab-btn-summary">
          1. 全域多專案健康度總覽
        </button>
        <button type="button" class="pmo-tab-btn" data-tab="PROJECT_DETAIL" id="tab-btn-detail">
          2. 階段達成率與時程偏差分析 (Ph 1~12 &amp; WBS)
        </button>
        <button type="button" class="pmo-tab-btn" data-tab="ASSIGNEES" id="tab-btn-assignees">
          3. 專案成員任務負荷與工時回報統計
        </button>
      </nav>
    </header>

    <!-- 自然語言 NoUI 智慧篩選與使用者團隊權限預讀區塊 (需求 1 & 需求 2) -->
    <section class="pmo-noui-filter-bar" aria-label="自然語言專案篩選條件">
      <div class="noui-top-row">
        <div class="noui-input-wrapper">
          <span class="noui-ai-icon" aria-hidden="true">&#10024;</span>
          <input
            type="text"
            id="nl-filter-input"
            class="noui-nl-input"
            placeholder="請以自然語言輸入篩選條件（例如：進行中 TPS 紅燈專案、新竹 customize、陳建宏、2127）... 預設保留 Standard 與 Professional"
            autocomplete="off"
          />
          <button type="button" class="btn-action noui-apply-btn" id="btn-apply-nl-filter">
            套用查詢
          </button>
          <button type="button" class="btn-action btn-secondary noui-reset-btn" id="btn-reset-filters">
            重置預設
          </button>
        </div>
        <!-- 當前使用者 (user.team_id.keyed_name 與 user.value_score) 預讀狀態徽章 -->
        <div id="user-context-badge-container" class="noui-user-badge-wrap"></div>
      </div>

      <!-- 常用條件提示標籤 (Prompt Chips) -->
      <div class="noui-prompt-row">
        <span class="noui-row-label">💡 常用條件提示：</span>
        <div id="noui-prompt-chips-container" class="noui-chips-list"></div>
      </div>

      <!-- 當前解析生效之篩選條件摘要與權限提示 -->
      <div id="noui-active-filters-summary" class="noui-active-summary"></div>
    </section>

    <!-- 動態視圖渲染容器 -->
    <main id="pmo-view-container"></main>
  </div>

  <!-- 載入 S.O.L.I.D 前端模組 -->
  <script src="./js/arasApiClient.js"></script>
  <script src="./js/dashboardStore.js"></script>
  <script src="./js/svgChartEngine.js"></script>
  <script src="./js/dashboardApp.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.PMODashboardApp && typeof window.PMODashboardApp.initDashboardApp === "function") {
        window.pmoStoreInstance = window.PMODashboardApp.initDashboardApp(document);
      }
    });
  </script>
</body>
</html>
